name: CI

# Every push and pull request is a potential release candidate, so the same
# required suite runs for both. End-to-end tests are not wired in yet: they need
# a dedicated Supabase test project and an authenticated storage-state fixture,
# which are tracked in MVP-BUILD-TRACKER.md step 1.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format check, lint, type check, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders. The build must not depend on real project
      # credentials, and no CI step may touch pilot data.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
